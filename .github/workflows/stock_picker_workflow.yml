name: 每日 300日資料累積與智慧選股

on:
  schedule:
    # 台灣時間週一至週五 下午 5:00 執行 (UTC 09:00)
    - cron: '0 9 * * 1-5'
  workflow_dispatch: # 支援手動按鈕觸發

jobs:
  run-smart-picker:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 檢出倉庫程式碼
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安裝依賴套件
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 執行 300日資料收集與智慧選股程式
      run: |
        python smart_picker.py

    - name: 自動提交並推送最新 TXT 與選股結果回 GitHub
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add stock_data_300days/ smart_selected_output.csv || true
        if ! git diff --cached --quiet; then
          git commit -m "Auto-update: 300日資料累積與智慧選股結果更新"
        fi
        git pull origin main --rebase || git pull origin master --rebase
        git push
