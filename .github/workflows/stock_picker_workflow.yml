name: 雲端自動更新 300日TXT與智慧選股

on:
  schedule:
    # 台灣時間週一至週五 下午 5:00 執行 (UTC 時間 09:00)
    - cron: '0 9 * * 1-5'
  workflow_dispatch: # 支援你在 GitHub 網頁手動點擊按鈕立即執行

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 賦予寫入倉庫的權限，讓它能自動儲存 TXT 與選股結果

    steps:
    - name: 檢出倉庫程式碼
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安裝依賴套件
      run: |
        python -m pip install --upgrade pip
        pip install pandas openpyxl yfinance

    - name: 執行資料更新與智慧選股程式
      run: |
        python smart_picker.py

    - name: 自動提交並推送最新 TXT 與選股結果回 GitHub
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git pull origin main --rebase || git pull origin master --rebase
        git add txt_data/ smart_selected_output.csv || true
        git diff-index --quiet HEAD || git commit -m "Auto-update: 每日自動更新 300日TXT資料與選股結果"
        git push
